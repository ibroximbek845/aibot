<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maison Élan — Admin</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:1000px;margin:50px auto;padding:20px"><a class="logo" href="/">MAISON <i>ÉLAN</i></a><section id="login" style="max-width:420px;margin:70px auto"><p class="eyebrow">PRIVATE ACCESS</p><h1 style="font:44px 'Playfair Display'">Welcome back.</h1><form id="loginForm"><input name="email" type="email" placeholder="Admin email" required style="display:block;width:100%;padding:15px;margin:12px 0"><input name="password" type="password" placeholder="Password" required style="display:block;width:100%;padding:15px;margin:12px 0"><button class="cta">SIGN IN ↗</button><p id="error"></p></form></section><section id="dash" hidden><h1 style="font:42px 'Playfair Display'">Atelier dashboard</h1><p id="who"></p><button id="logout" class="cta">SIGN OUT</button><h2>Products</h2><form id="productForm" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px"><input name="name" placeholder="Product name" required><input name="price" type="number" step=".01" placeholder="Price" required><select name="category"><option>Women</option><option>Men</option><option>Accessories</option><option>New arrivals</option></select><input name="image_url" placeholder="Image URL"><textarea name="description" placeholder="Description"></textarea><input name="sizes" value="S,M,L" placeholder="Sizes, comma separated"><label><input type="checkbox" name="featured"> Featured</label><button class="cta">ADD PRODUCT</button></form><div id="productsAdmin"></div><h2>Orders</h2><div id="ordersAdmin"></div></section></main><script src="/admin.js"></script></body></html>
